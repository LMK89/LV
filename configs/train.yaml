dataset_path: "data/splits/train_augmented.jsonl"
val_dataset_path: "data/splits/val.jsonl"
output_dir: "outputs/checkpoints"
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 1.0e-4
num_train_epochs: 5
lr_scheduler_type: "cosine"
warmup_ratio: 0.05
max_label_length: 768
fp32: false
fp16: false
bf16: true
eval_strategy: "steps"
eval_steps: 100
save_strategy: "steps"
save_steps: 200
save_total_limit: 2
load_best_model_at_end: true
metric_for_best_model: "eval_ce"
greater_is_better: false
early_stopping_patience: 15
logging_steps: 10
report_to: "none"
remove_unused_columns: false
label_names:
  - "labels"
dataloader_num_workers: 0
dataloader_pin_memory: false
