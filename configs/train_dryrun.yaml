dataset_path: "data/splits/train.jsonl"
val_dataset_path: "data/splits/val.jsonl"
output_dir: "outputs/step3_dryrun"
per_device_train_batch_size: 2
gradient_accumulation_steps: 1
learning_rate: 1.0e-4
max_steps: 1
eval_strategy: "steps"
eval_steps: 1
save_strategy: "steps"
save_steps: 1
save_total_limit: 1
load_best_model_at_end: false
metric_for_best_model: "eval_ce"
greater_is_better: false
early_stopping_patience: 1
logging_steps: 1
report_to: "none"
remove_unused_columns: false
label_names:
  - "labels"
dataloader_num_workers: 0
dataloader_pin_memory: false
fp32: true
fp16: false
bf16: false
max_train_samples: 4
max_eval_samples: 4
max_label_length: 64
